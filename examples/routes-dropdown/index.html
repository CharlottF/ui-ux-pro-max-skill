<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вибір рейсу — комбобокс з недоступними опціями</title>
<style>
  :root{
    --bg: #eef2f4;
    --surface: #ffffff;
    --line: #111111;
    --line-weak: #d5d9dc;
    --text: #111111;
    --text-muted: #8a9099;
    --text-faint: #b3b8bf;
    --hover: #eef1f4;
    --radius: 4px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    padding: 48px 16px;
  }

  .page{
    width: 100%;
    max-width: 460px;
  }

  .field-group{ margin-bottom: 28px; }

  .field-label{
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  /* ---------- Combobox ---------- */

  .combo{
    position: relative;
    width: 100%;
  }

  .combo-input-row{
    position: relative;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  .combo-input{
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 19px;
    font-weight: 600;
    color: var(--text);
    padding: 0;
    min-width: 0;
  }
  .combo-input::placeholder{ color: var(--text-faint); font-weight: 400; }

  .combo-arrow{
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 7px solid var(--text);
    flex-shrink: 0;
    cursor: pointer;
    transition: transform .15s ease;
  }
  .combo[data-open="true"] .combo-arrow{ transform: rotate(180deg); }

  .combo-panel{
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--surface);
    border: 1px solid var(--line-weak);
    box-shadow: 0 8px 24px rgba(17,17,17,0.10);
    max-height: 320px;
    overflow-y: auto;
  }
  .combo-panel[hidden]{ display: none; }

  .combo-empty{
    padding: 16px;
    font-size: 15px;
    color: var(--text-muted);
  }

  .combo-row{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    background: transparent;
    text-align: left;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    cursor: pointer;
  }
  .combo-row:hover,
  .combo-row:focus-visible{
    background: var(--hover);
    outline: none;
  }
  .combo-row[aria-selected="true"]{ background: var(--hover); font-weight: 600; }

  .row-body{ display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .row-name{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-meta{ font-size: 12.5px; color: var(--text-muted); }

  .row-divider{ height: 1px; background: var(--line-weak); margin: 4px 0; }

  .combo-group-label{
    padding: 10px 16px 4px;
    font-size: 11px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* unavailable row — whole row is the "learn more" trigger, not a selectable option */
  .combo-row.is-unavailable{ cursor: pointer; }
  .combo-row.is-unavailable .row-name{ color: var(--text-muted); }
  .combo-row.is-unavailable .row-reason{
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .combo-row.is-unavailable:hover .row-reason,
  .combo-row.is-unavailable:focus-visible .row-reason{ color: var(--text-muted); }

  .info-icon{
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1px solid var(--text-faint);
    color: var(--text-faint);
    font-size: 11px;
    font-weight: 700;
    font-style: normal;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .combo-row.is-unavailable:hover .info-icon,
  .combo-row.is-unavailable:focus-visible .info-icon{
    border-color: var(--text);
    color: var(--text);
  }

  /* ---------- CTA ---------- */

  .cta{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #111111;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 16px 40px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .cta:hover{ background: #000; }
  .cta:focus-visible{ outline: 2px solid #111; outline-offset: 3px; }

  /* ---------- Modal ---------- */

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 17, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay[hidden]{ display: none; }

  .modal{
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    padding: 28px 26px 22px;
  }

  .modal-header{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .modal-title{
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .modal-route-meta{
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .modal-close{
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text);
    padding: 2px;
    line-height: 0;
    flex-shrink: 0;
  }
  .modal-close:focus-visible{ outline: 2px solid var(--text); outline-offset: 2px; }

  .modal-body p{
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 18px;
  }

  .modal-facts{
    list-style: none;
    margin: 0 0 22px;
    padding: 14px 0 0;
    border-top: 1px solid var(--line-weak);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-facts li{
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
  }
  .modal-facts .fact-label{ color: var(--text-muted); }
  .modal-facts .fact-value{ font-weight: 600; text-align: right; }

  .modal-actions{ display: flex; }
  .modal-actions .cta{ width: 100%; margin-top: 0; padding: 14px 0; }
</style>
</head>
<body>

<div class="page">

  <div class="field-group">
    <label class="field-label" for="routeInput">Рейс</label>
    <div class="combo" id="routeCombo" data-open="false">
      <div class="combo-input-row">
        <input
          type="text"
          id="routeInput"
          class="combo-input"
          role="combobox"
          aria-expanded="false"
          aria-controls="routePanel"
          aria-autocomplete="list"
          autocomplete="off"
          placeholder="Оберіть рейс"
        >
        <span class="combo-arrow" id="routeArrow" aria-hidden="true"></span>
      </div>

      <div class="combo-panel" id="routePanel" role="listbox" aria-label="Список рейсів" hidden>
        <div class="combo-empty" id="routeEmpty" hidden>Нічого не знайдено</div>
        <div id="routeItems"></div>
      </div>
    </div>
  </div>

  <button type="button" class="cta">Продовжити</button>

</div>

<div class="modal-overlay" id="routeModalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="routeModal">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="modalTitle">Причина недоступності</h2>
        <p class="modal-route-meta" id="modalRouteMeta"></p>
      </div>
      <button type="button" class="modal-close" id="modalClose" aria-label="Закрити">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <p id="modalDetails"></p>
      <ul class="modal-facts">
        <li><span class="fact-label">Статус</span><span class="fact-value" id="modalStatus"></span></li>
        <li><span class="fact-label">Очікуване відновлення</span><span class="fact-value" id="modalUntil"></span></li>
      </ul>
    </div>
    <div class="modal-actions">
      <button type="button" class="cta" id="modalOk">Зрозуміло</button>
    </div>
  </div>
</div>

<script>
(function () {
  var routes = [
    { id: 'bc-vienna', name: 'Біла Церква-Відень DE0051', meta: 'Щодня · відправлення 21:00', available: true },
    { id: 'od-munich', name: 'Одеса-Мюнхен DE00115', meta: 'Пн, Ср, Пт · відправлення 18:30', available: true },
    { id: 'kv-berlin', name: 'Київ-Берлін DE0073', meta: 'Щодня · відправлення 07:15', available: false,
      reason: 'Недоступно: інший заїзд',
      details: 'Усі місця на цей рейс закріплені за іншою групою заїзду (бронь №4821, заїзд 12–19 серпня). Рейс знову відкриється для самостійного бронювання після завершення поточного заїзду.',
      status: 'Заброньовано іншою групою', until: '19 серпня, 00:00' },
    { id: 'lv-krakow', name: 'Львів-Краків DE0032', meta: 'Вт, Чт, Сб · відправлення 06:40', available: false,
      reason: 'Недоступно: технічне обслуговування',
      details: 'Транспорт на цьому рейсі проходить планове технічне обслуговування. Бронювання відновиться автоматично, щойно рейс пройде перевірку і повернеться до розкладу.',
      status: 'На обслуговуванні', until: '16 серпня, 12:00' },
    { id: 'od-warsaw', name: 'Одеса-Варшава DE0098', meta: 'Щодня · відправлення 23:50', available: false,
      reason: 'Недоступно: сезон закрито',
      details: 'Рейс не виконується у поточному сезоні через низький попит у цей час року. Орієнтовна дата відновлення — початок жовтня, ближче до дати розклад буде оновлено.',
      status: 'Сезонна перерва', until: 'орієнтовно 1 жовтня' }
  ];

  var combo = document.getElementById('routeCombo');
  var input = document.getElementById('routeInput');
  var arrow = document.getElementById('routeArrow');
  var panel = document.getElementById('routePanel');
  var empty = document.getElementById('routeEmpty');
  var itemsHost = document.getElementById('routeItems');

  var modalOverlay = document.getElementById('routeModalOverlay');
  var modalTitle = document.getElementById('modalTitle');
  var modalRouteMeta = document.getElementById('modalRouteMeta');
  var modalDetails = document.getElementById('modalDetails');
  var modalStatus = document.getElementById('modalStatus');
  var modalUntil = document.getElementById('modalUntil');
  var modalClose = document.getElementById('modalClose');
  var modalOk = document.getElementById('modalOk');

  var selectedId = null;
  var lastFocusedBeforeModal = null;

  function isPanelOpen() { return !panel.hidden; }
  function isModalOpen() { return !modalOverlay.hidden; }

  function openPanel() {
    panel.hidden = false;
    combo.setAttribute('data-open', 'true');
    input.setAttribute('aria-expanded', 'true');
    render(input.value);
  }

  function closePanel() {
    panel.hidden = true;
    combo.setAttribute('data-open', 'false');
    input.setAttribute('aria-expanded', 'false');
  }

  function matches(route, query) {
    return route.name.toLowerCase().indexOf(query.trim().toLowerCase()) !== -1;
  }

  function render(query) {
    var list = routes.filter(function (r) { return matches(r, query); });
    itemsHost.innerHTML = '';

    if (list.length === 0) {
      empty.hidden = false;
      return;
    }
    empty.hidden = true;

    var available = list.filter(function (r) { return r.available; });
    var unavailable = list.filter(function (r) { return !r.available; });

    available.forEach(function (route) {
      itemsHost.appendChild(buildAvailableRow(route));
    });

    if (available.length && unavailable.length) {
      var divider = document.createElement('div');
      divider.className = 'row-divider';
      itemsHost.appendChild(divider);
    }

    unavailable.forEach(function (route) {
      itemsHost.appendChild(buildUnavailableRow(route));
    });
  }

  function buildAvailableRow(route) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'combo-row';
    btn.setAttribute('role', 'option');
    btn.setAttribute('aria-selected', String(route.id === selectedId));

    var body = document.createElement('span');
    body.className = 'row-body';
    body.innerHTML =
      '<span class="row-name">' + route.name + '</span>' +
      '<span class="row-meta">' + route.meta + '</span>';
    btn.appendChild(body);

    btn.addEventListener('click', function () {
      selectedId = route.id;
      input.value = route.name;
      closePanel();
    });

    return btn;
  }

  function buildUnavailableRow(route) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'combo-row is-unavailable';
    btn.setAttribute('aria-label', route.name + ' — недоступно. ' + route.reason + '. Натисніть, щоб дізнатися більше');

    var body = document.createElement('span');
    body.className = 'row-body';
    body.innerHTML =
      '<span class="row-name">' + route.name + '</span>' +
      '<span class="row-reason">' + route.reason + '</span>';
    btn.appendChild(body);

    var icon = document.createElement('span');
    icon.className = 'info-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = 'i';
    btn.appendChild(icon);

    btn.addEventListener('click', function () {
      openReasonModal(route, btn);
    });

    return btn;
  }

  function openReasonModal(route, triggerEl) {
    lastFocusedBeforeModal = triggerEl;
    modalTitle.textContent = route.name;
    modalRouteMeta.textContent = route.meta;
    modalDetails.textContent = route.details;
    modalStatus.textContent = route.status;
    modalUntil.textContent = route.until;
    modalOverlay.hidden = false;
    modalClose.focus();
  }

  function closeModal() {
    modalOverlay.hidden = true;
    if (lastFocusedBeforeModal) lastFocusedBeforeModal.focus();
  }

  input.addEventListener('focus', openPanel);
  input.addEventListener('input', function () { render(input.value); openPanel(); });

  arrow.addEventListener('click', function () {
    if (isPanelOpen()) closePanel(); else { input.focus(); openPanel(); }
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      openPanel();
      var first = panel.querySelector('.combo-row');
      if (first) first.focus();
    } else if (e.key === 'Escape') {
      closePanel();
    }
  });

  panel.addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call(panel.querySelectorAll('.combo-row'));
    var idx = items.indexOf(document.activeElement);

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      (items[idx + 1] || items[0]).focus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (idx <= 0) input.focus(); else items[idx - 1].focus();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closePanel();
      input.focus();
    }
  });

  document.addEventListener('click', function (e) {
    if (isModalOpen()) return;
    if (!isPanelOpen()) return;
    if (combo.contains(e.target)) return;
    closePanel();
  });

  modalClose.addEventListener('click', closeModal);
  modalOk.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', function (e) {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && isModalOpen()) {
      e.stopPropagation();
      closeModal();
    }
  });
  modalOverlay.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var focusable = modalOverlay.querySelectorAll('button');
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  render('');
})();
</script>

</body>
</html>
